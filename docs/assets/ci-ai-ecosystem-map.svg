<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">One ecosystem, two predictable branches</title>
<desc id="desc">An animated network of repositories converges on two consistent branch lanes: development for active work and master for released state.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#202b43"/></linearGradient>
 <linearGradient id="dev" x1="0" x2="1"><stop stop-color="#4fd1c5"/><stop offset="1" stop-color="#8be9fd"/></linearGradient>
 <linearGradient id="master" x1="0" x2="1"><stop stop-color="#f6c76b"/><stop offset="1" stop-color="#fda4af"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef4ff}
  .muted{fill:#aab8d0}.repo{fill:#172740;stroke:#60728e;stroke-width:1.5}
  .wire{fill:none;stroke:#60728e;stroke-width:2;stroke-dasharray:7 9;animation:flow 8s linear infinite}
  .d{fill:none;stroke:url(#dev);stroke-width:5;stroke-linecap:round}
  .m{fill:none;stroke:url(#master);stroke-width:5;stroke-linecap:round}
  .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes flow{to{stroke-dashoffset:-128}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
 </style>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="58" y="62" font-size="18" letter-spacing="4" class="muted">THE SINGULARITY WORKSHOP · REPOSITORY GOVERNANCE</text>
<text x="58" y="112" font-size="38" font-weight="700">One ecosystem. Two predictable places to look.</text>
<text x="58" y="148" font-size="18" class="muted">Reduce branch archaeology so attention stays on the work.</text>
<g>
 <rect class="repo" x="62" y="205" width="235" height="68" rx="14"/><text x="84" y="246" font-size="20" font-weight="600">FSM_API</text>
 <rect class="repo" x="62" y="296" width="235" height="68" rx="14"/><text x="84" y="337" font-size="20" font-weight="600">GrammarAi</text>
 <rect class="repo" x="62" y="387" width="235" height="68" rx="14"/><text x="84" y="428" font-size="20" font-weight="600">AnyApp</text>
 <path class="wire" d="M297 239 C390 239 390 257 490 257 M297 330 C390 330 390 257 490 257 M297 421 C390 421 390 257 490 257"/>
 <circle class="pulse" cx="490" cy="257" r="8" fill="#8be9fd" filter="url(#glow)"/>
 <text x="410" y="205" font-size="15" class="muted">same rule</text>
</g>
<g>
 <rect x="535" y="188" width="590" height="132" rx="18" fill="#12263b" stroke="#3d7180" stroke-width="1.5"/>
 <text x="570" y="224" font-size="16" letter-spacing="2" fill="#8be9fd">ACTIVE SOURCE</text>
 <path class="d" d="M570 265 H1070"/><circle class="pulse" cx="1070" cy="265" r="9" fill="#8be9fd" filter="url(#glow)"/>
 <text x="570" y="299" font-size="27" font-weight="700">development</text>
 <text x="1090" y="299" font-size="15" text-anchor="end" class="muted">build here</text>
 <rect x="535" y="345" width="590" height="132" rx="18" fill="#2a2630" stroke="#8b7049" stroke-width="1.5"/>
 <text x="570" y="381" font-size="16" letter-spacing="2" fill="#f6c76b">RELEASED STATE</text>
 <path class="m" d="M570 422 H1070"/><circle class="pulse" cx="1070" cy="422" r="9" fill="#f6c76b" filter="url(#glow)" style="animation-delay:.8s"/>
 <text x="570" y="456" font-size="27" font-weight="700">master</text>
 <text x="1090" y="456" font-size="15" text-anchor="end" class="muted">released / aligned</text>
</g>
<text x="62" y="493" font-size="14" class="muted">The policy reports branch drift; it does not silently delete branches or authorize releases.</text>
</svg>