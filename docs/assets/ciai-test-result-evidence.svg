<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">CiAi test-result evidence trust path</title>
  <desc id="desc">A trusted host observes an exact GitHub Actions workflow attempt, verifies the provider artifact and job binding, validates workflow provenance and TRX bytes, and emits a bounded versioned report. Foundry accepts and authorizes downstream work; HeadlessAi only consumes accepted context and returns a proposal.</desc>
  <defs>
    <linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#65dfbd"/><stop offset="1" stop-color="#78c9ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78c9ff"/></marker>
    <style>
      .bg{fill:#081521}.panel{fill:#10283b;stroke:#3b6179;stroke-width:2}.trusted{stroke:#65dfbd}.host{fill:#163b3b;stroke:#65dfbd;stroke-width:2}.consumer{fill:#172f49;stroke:#78c9ff;stroke-width:2}.title{font:700 22px system-ui,sans-serif;fill:#f0f7fc}.body{font:15px system-ui,sans-serif;fill:#c0d1dd}.small{font:13px system-ui,sans-serif;fill:#a9bfd0}.caps{font:700 13px system-ui,sans-serif;letter-spacing:1.6px;fill:#65dfbd}.line{fill:none;stroke:url(#flow);stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffd27d;stroke-width:2.5;stroke-dasharray:9 8}.warn{font:700 14px system-ui,sans-serif;fill:#ffd27d}
      @media(prefers-reduced-motion:no-preference){.pulse{animation:pulse 3.4s ease-in-out infinite}.pulse2{animation:pulse 3.4s ease-in-out 1.1s infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="640" rx="28"/>
  <text x="54" y="58" class="caps">EXACT-RUN EVIDENCE · TRUST BOUNDARIES</text>
  <text x="54" y="94" class="title" font-size="30">From provider bytes to a bounded, provenance-bound report</text>
  <g transform="translate(50 155)">
    <rect class="panel" width="210" height="170" rx="18"/>
    <text x="105" y="40" text-anchor="middle" class="title">GitHub Actions</text>
    <text x="105" y="75" text-anchor="middle" class="body">Run + attempt</text>
    <text x="105" y="101" text-anchor="middle" class="body">Workflow + job</text>
    <text x="105" y="127" text-anchor="middle" class="body">Artifact ZIP + digest</text>
    <text x="105" y="151" text-anchor="middle" class="small">Provider is authoritative</text>
  </g>
  <path class="line pulse" d="M260 240H315"/>
  <g transform="translate(320 135)">
    <rect class="host" width="260" height="210" rx="18"/>
    <text x="130" y="40" text-anchor="middle" class="caps">HOST-OBSERVED</text>
    <text x="130" y="76" text-anchor="middle" class="title">Source binding</text>
    <text x="130" y="111" text-anchor="middle" class="body">Exact repo / run / attempt</text>
    <text x="130" y="139" text-anchor="middle" class="body">Independent job + artifact ID</text>
    <text x="130" y="167" text-anchor="middle" class="body">Configured required job key</text>
    <text x="130" y="193" text-anchor="middle" class="small">Never copied from report JSON</text>
  </g>
  <path class="line pulse2" d="M580 240H635"/>
  <g transform="translate(640 135)">
    <rect class="panel trusted" width="250" height="210" rx="18"/>
    <text x="125" y="40" text-anchor="middle" class="caps">BYTE VERIFICATION</text>
    <text x="125" y="76" text-anchor="middle" class="title">Verify + parse</text>
    <text x="125" y="111" text-anchor="middle" class="body">Provider ZIP digest + size</text>
    <text x="125" y="139" text-anchor="middle" class="body">Safe bounded extraction</text>
    <text x="125" y="167" text-anchor="middle" class="body">Provenance + TRX SHA-256</text>
    <text x="125" y="193" text-anchor="middle" class="small">Bounded XML / result count</text>
  </g>
  <path class="line" d="M890 240H945"/>
  <g transform="translate(950 155)">
    <rect class="consumer" width="200" height="170" rx="18"/>
    <text x="100" y="42" text-anchor="middle" class="caps">CI AI CONTRACT</text>
    <text x="100" y="78" text-anchor="middle" class="title">Report v1</text>
    <text x="100" y="110" text-anchor="middle" class="body">ciai.test-results.v1</text>
    <text x="100" y="138" text-anchor="middle" class="body">Verdict + reason codes</text>
  </g>
  <path class="dash" d="M1050 325V405H800"/>
  <g transform="translate(555 410)">
    <rect class="consumer" width="390" height="135" rx="18"/>
    <text x="195" y="39" text-anchor="middle" class="caps">DOWNSTREAM OWNERSHIP</text>
    <text x="195" y="73" text-anchor="middle" class="title">Foundry accepts evidence</text>
    <text x="195" y="101" text-anchor="middle" class="body">Task lifecycle · replay · authorization</text>
  </g>
  <path class="line" d="M945 477H1000"/>
  <g transform="translate(1005 410)">
    <rect class="panel" width="145" height="135" rx="18"/>
    <text x="72" y="39" text-anchor="middle" class="title">HeadlessAi</text>
    <text x="72" y="70" text-anchor="middle" class="body">Proposal only</text>
    <text x="72" y="98" text-anchor="middle" class="small">No action</text>
    <text x="72" y="118" text-anchor="middle" class="small">authority</text>
  </g>
  <text x="55" y="440" class="warn">FAIL CLOSED</text>
  <text x="55" y="470" class="body">Missing, ambiguous,</text>
  <text x="55" y="496" class="body">mismatched, expired, or</text>
  <text x="55" y="522" class="body">unverifiable evidence</text>
  <text x="55" y="548" class="body">cannot become a pass.</text>
  <text x="600" y="606" text-anchor="middle" class="small">CiAi produces a typed evidence verdict. It does not authorize merge, publication, deployment, or execution.</text>
</svg>