<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">NuGet University — a living campus for package monsters</title>
<desc id="desc">An animated collegiate campus populated by original NuGet package mascots. Package creatures blink, bob, wave and bounce as flags flutter and campus lights glow. CiAi is an alpha student; the commencement gate remains marked not published.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9bd7ff"/><stop offset="1" stop-color="#f7eaff"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#fff8e9"/><stop offset="1" stop-color="#d9d9f2"/></linearGradient>
 <linearGradient id="roof" x2="1" y2="1"><stop stop-color="#354985"/><stop offset="1" stop-color="#7959a8"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#25345a" flood-opacity=".22"/></filter>
 <style>
  .title{font:900 46px 'Trebuchet MS',Arial,sans-serif;fill:#25345d;letter-spacing:1px}
  .sub{font:700 19px 'Trebuchet MS',Arial,sans-serif;fill:#425579}
  .sign{font:900 23px 'Trebuchet MS',Arial,sans-serif;fill:#fff;letter-spacing:2px}
  .tiny{font:800 14px 'Trebuchet MS',Arial,sans-serif;fill:#31415e}
  .eye{fill:#17233d}.shine{fill:#fff}.limb{fill:none;stroke:#46557a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .float{animation:float 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float2{animation:float 2.7s ease-in-out -1.1s infinite;transform-box:fill-box;transform-origin:center}
  .bob{animation:bob 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .wave{animation:wave 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:12% 18%}
  .flag{animation:flag 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
  .cloud{animation:cloud 22s ease-in-out infinite alternate}
  .sunray{animation:sun 7s linear infinite;transform-origin:1050px 88px}
  .blink{animation:blink 4.8s infinite;transform-box:fill-box;transform-origin:center}
  .glow{animation:glow 2.4s ease-in-out infinite alternate}
  .spark{animation:spark 2.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
  @keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-7deg)}}
  @keyframes cloud{from{transform:translateX(-12px)}to{transform:translateX(28px)}}
  @keyframes sun{to{transform:rotate(360deg)}}
  @keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}
  @keyframes glow{from{opacity:.45}to{opacity:1}}
  @keyframes spark{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.float,.float2,.bob,.wave,.flag,.cloud,.sunray,.blink,.glow,.spark{animation:none}}
 </style>
</defs>
<rect width="1200" height="680" rx="26" fill="url(#sky)"/>
<g class="sunray"><circle cx="1050" cy="88" r="62" fill="#ffe99b" opacity=".28"/><circle cx="1050" cy="88" r="48" fill="#ffe99b"/><g stroke="#ffd76d" stroke-width="5" stroke-linecap="round"><path d="M1050 17v-12M1050 171v-12M979 88h-12M1133 88h-12M1000 38l-9-9M1109 147l-9-9M1100 38l9-9M1000 138l-9 9"/></g></g>
<g class="cloud" fill="#fff" opacity=".78"><path d="M70 135q-7-27 22-35 10-34 46-17 29-8 37 21 29 0 27 31z"/></g>
<g class="cloud" fill="#fff" opacity=".7" style="animation-delay:-8s"><path d="M870 175q-5-22 20-30 9-28 39-14 24-7 30 18 25 0 22 26z"/></g>
<text x="58" y="62" class="sub" letter-spacing="3">THE SINGULARITY WORKSHOP • CAMPUS LIFE</text>
<text x="58" y="116" class="title">NUGET UNIVERSITY</text>
<text x="60" y="148" class="sub">Where little packages go to grow up into dependable releases.</text>
<path d="M0 500q260-60 500 0t700-4v184H0z" fill="#8ed6a2"/>
<path d="M510 680q75-95 120-180h130q-40 95-65 180z" fill="#f6e5bf"/>
<!-- Main college -->
<g filter="url(#shadow)">
 <path d="M245 270L600 145l355 125z" fill="url(#roof)" stroke="#293b76" stroke-width="5"/>
 <rect x="280" y="268" width="640" height="245" rx="10" fill="url(#stone)" stroke="#a9a6d1" stroke-width="5"/>
 <rect x="260" y="255" width="680" height="26" rx="8" fill="#7b75ad"/>
 <g fill="#a8a5d1" stroke="#fff" stroke-width="4"><rect x="315" y="295" width="54" height="188" rx="25"/><rect x="435" y="295" width="54" height="188" rx="25"/><rect x="711" y="295" width="54" height="188" rx="25"/><rect x="831" y="295" width="54" height="188" rx="25"/></g>
 <g fill="#8bc9ed" stroke="#fff" stroke-width="6"><rect x="385" y="320" width="82" height="92" rx="34"/><rect x="733" y="320" width="82" height="92" rx="34"/></g>
 <path d="M530 513v-115q0-74 70-74t70 74v115z" fill="#485a98" stroke="#fff" stroke-width="7"/><path d="M550 513v-112q0-52 50-52t50 52v112z" fill="#9bcff0"/>
 <rect x="430" y="205" width="340" height="52" rx="13" fill="#34477e" stroke="#fff" stroke-width="4"/>
 <text x="600" y="239" text-anchor="middle" class="sign">SCHOOL OF PACKAGE ARTS</text>
 <path d="M600 146v-48" stroke="#34477e" stroke-width="8"/><path d="M600 100l72 17-72 18z" fill="#ffcf63" class="flag"/>
</g>
<!-- Fluttering campus pennants -->
<g><path d="M300 270v95l-26-18-26 18v-95" fill="#e77e78" stroke="#fff" stroke-width="3" class="flag"/><text x="274" y="319" text-anchor="middle" class="tiny" fill="#fff">BUILD</text>
<path d="M900 270v95l-26-18-26 18v-95" fill="#65a8d6" stroke="#fff" stroke-width="3" class="flag"/><text x="874" y="319" text-anchor="middle" class="tiny" fill="#fff">TEST</text></g>
<!-- Blackboard -->
<g filter="url(#shadow)"><rect x="455" y="290" width="290" height="65" rx="10" fill="#243e48" stroke="#fff" stroke-width="5"/>
<text x="600" y="316" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="13" font-weight="900" fill="#a9f0c8">TODAY'S LESSON</text>
<text x="600" y="340" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="19" font-weight="900" fill="#fff">VERIFY BEFORE GRADUATION</text></g>
<!-- Package student: orange blob box, bouncing and blinking -->
<g class="float" transform="translate(95 380)" filter="url(#shadow)">
 <path d="M33 10q-25-35-5-53 27 7 32 28 40-27 60 2 30-7 43 25l-8 95q-3 28-32 28H39q-28-4-26-35z" fill="#f5a65b" stroke="#fff" stroke-width="6"/>
 <path d="M44 16l53-24 50 26-52 27z" fill="#ffd08a" stroke="#d17b43" stroke-width="4"/><path d="M95 19v96" stroke="#d17b43" stroke-width="4"/>
 <g class="blink"><ellipse cx="75" cy="66" rx="14" ry="19" class="shine"/><ellipse cx="119" cy="66" rx="14" ry="19" class="shine"/><circle cx="78" cy="69" r="7" class="eye"/><circle cx="116" cy="69" r="7" class="eye"/></g>
 <path d="M82 94q17 17 34 0" fill="none" stroke="#713f3c" stroke-width="5" stroke-linecap="round"/>
 <path d="M20 86q-34 15-25 39M164 87q32 12 22 35M52 150l-10 26M130 150l15 26" class="limb"/>
 <text x="97" y="135" text-anchor="middle" class="tiny">PKG-101</text>
 <path d="M165 24q18-25 29-3" class="limb wave"/>
</g>
<!-- Purple horned package -->
<g class="float2" transform="translate(960 380)" filter="url(#shadow)">
 <path d="M25 25l-13-37 39 22M130 10l37-23-8 44" fill="#a58be5" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
 <rect x="17" y="20" width="145" height="133" rx="27" fill="#8b83d8" stroke="#fff" stroke-width="6"/>
 <path d="M17 51l73-30 72 30-73 32z" fill="#b9b0f4" stroke="#fff" stroke-width="4"/><path d="M89 53v95" stroke="#5d57a8" stroke-width="4"/>
 <g class="blink"><ellipse cx="66" cy="91" rx="13" ry="17" class="shine"/><ellipse cx="112" cy="91" rx="13" ry="17" class="shine"/><circle cx="68" cy="94" r="7" class="eye"/><circle cx="110" cy="94" r="7" class="eye"/></g>
 <path d="M73 117q16 14 32 0" fill="none" stroke="#37305f" stroke-width="5" stroke-linecap="round"/>
 <path d="M17 94q-28 3-31 29M162 95q29 5 30 30M55 151l-8 25M127 151l9 25" class="limb"/>
 <text x="90" y="143" text-anchor="middle" class="tiny">PKG-202</text>
</g>
<!-- CiAi: the featured alpha student, gently bobbing -->
<g class="bob" transform="translate(455 440)" filter="url(#shadow)">
 <path d="M16 85q-35-8-42 20M190 85q37-10 44 17M52 170l-13 28M154 170l14 28" class="limb"/>
 <rect x="0" y="20" width="210" height="155" rx="28" fill="#f7fbff" stroke="#526bc0" stroke-width="7"/>
 <path d="M0 59l105-43 105 43-105 44z" fill="#b5cbff" stroke="#526bc0" stroke-width="5"/><path d="M105 60v107" stroke="#8298d4" stroke-width="4"/>
 <path d="M47 26L25-7l45 20M163 26l23-33-46 18" fill="#7c65c9" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
 <path d="M58 12l47-38 48 38z" fill="#e8b84f" stroke="#fff" stroke-width="5"/><path d="M104-26v-20" stroke="#e8b84f" stroke-width="6"/><circle cx="104" cy="-48" r="6" fill="#e8b84f"/>
 <g class="blink"><ellipse cx="76" cy="93" rx="15" ry="19" class="shine"/><ellipse cx="136" cy="93" rx="15" ry="19" class="shine"/><circle cx="79" cy="96" r="8" class="eye"/><circle cx="133" cy="96" r="8" class="eye"/></g>
 <path d="M82 123q24 22 48 0" fill="none" stroke="#35446f" stroke-width="6" stroke-linecap="round"/>
 <rect x="25" y="137" width="160" height="29" rx="8" fill="#435db1"/><text x="105" y="158" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="19" font-weight="900" fill="#fff">CiAi</text>
 <!-- waving hand -->
 <path d="M192 88q34-19 36-48" class="limb wave"/><circle cx="228" cy="37" r="8" fill="#f7fbff" stroke="#46557a" stroke-width="4"/>
</g>
<!-- Alpha sash and version scroll -->
<g transform="rotate(-8 765 520)" filter="url(#shadow)"><path d="M690 480h175v47H690z" fill="#f2a72e" stroke="#fff" stroke-width="5"/><text x="777" y="511" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="24" font-weight="900" fill="#49300e">ALPHA STUDENT</text></g>
<g transform="translate(745 540) rotate(6)" filter="url(#shadow)"><rect width="180" height="62" rx="9" fill="#fff" stroke="#8b9bc7" stroke-width="3"/><text x="90" y="24" text-anchor="middle" class="tiny">CURRENT COURSEWORK</text><text x="90" y="47" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="18" font-weight="900" fill="#4354a8">0.1.0-alpha.1</text></g>
<!-- Commencement gate deliberately closed -->
<g transform="translate(35 535)"><path d="M0 90V0h205v90M0 18h205" fill="none" stroke="#566b9e" stroke-width="9"/><rect x="18" y="23" width="169" height="58" rx="9" fill="#fff" stroke="#566b9e" stroke-width="3"/><text x="102" y="46" text-anchor="middle" class="tiny">COMMENCEMENT GATE</text><text x="102" y="67" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="14" font-weight="900" fill="#bd4a38">NOT PUBLISHED</text><circle cx="198" cy="8" r="5" fill="#ffcf63" class="glow"/></g>
<!-- Little magical campus sparkles -->
<g fill="#fff4ad"><path class="spark" d="M350 420l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path class="spark" style="animation-delay:-.8s" d="M850 430l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/><path class="spark" style="animation-delay:-1.4s" d="M1030 330l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
<text x="600" y="658" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="17" font-weight="800" fill="#344768">Passing the coursework is not the same as graduating.</text>
</svg>