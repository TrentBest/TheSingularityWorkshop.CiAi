<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">NuGet University — where packages go to grow</title>
<desc id="desc">An original, playful monster-college campus populated entirely by living NuGet package mascots. The CiAi alpha package is a little box creature attending class, not yet graduated or published.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a9dcff"/><stop offset="1" stop-color="#f4eaff"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#fff7e8"/><stop offset="1" stop-color="#d9d8f2"/></linearGradient>
 <linearGradient id="roof" x2="1" y2="1"><stop stop-color="#374b91"/><stop offset="1" stop-color="#7256a9"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#25345a" flood-opacity=".22"/></filter>
 <style>
 .title{font:900 46px 'Trebuchet MS',Arial,sans-serif;fill:#25345d;letter-spacing:1px}
 .sub{font:700 19px 'Trebuchet MS',Arial,sans-serif;fill:#425579}
 .sign{font:900 23px 'Trebuchet MS',Arial,sans-serif;fill:#fff;letter-spacing:2px}
 .tiny{font:800 14px 'Trebuchet MS',Arial,sans-serif;fill:#31415e}
 .eye{fill:#17233d}.shine{fill:#fff}.limb{fill:none;stroke:#46557a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1200" height="650" rx="26" fill="url(#sky)"/>
<circle cx="1050" cy="88" r="50" fill="#ffe99b"/>
<g fill="#fff" opacity=".75"><path d="M70 135q-7-27 22-35 10-34 46-17 29-8 37 21 29 0 27 31z"/><path d="M920 160q-5-22 20-30 9-28 39-14 24-7 30 18 25 0 22 26z"/></g>
<text x="58" y="62" class="sub" letter-spacing="3">THE SINGULARITY WORKSHOP • CAMPUS LIFE</text>
<text x="58" y="116" class="title">NUGet UNIVERSITY</text>
<text x="60" y="148" class="sub">Where little packages go to grow up into dependable releases.</text>
<!-- campus lawn and path -->
<path d="M0 480q260-60 500 0t700-4v174H0z" fill="#8ed6a2"/>
<path d="M510 650q75-95 120-180h130q-40 95-65 180z" fill="#f6e5bf"/>
<!-- grand collegiate building -->
<g filter="url(#shadow)">
 <path d="M245 270L600 145l355 125z" fill="url(#roof)" stroke="#293b76" stroke-width="5"/>
 <rect x="280" y="268" width="640" height="245" rx="10" fill="url(#stone)" stroke="#a9a6d1" stroke-width="5"/>
 <rect x="260" y="255" width="680" height="26" rx="8" fill="#7b75ad"/>
 <g fill="#a8a5d1" stroke="#fff" stroke-width="4">
  <rect x="315" y="295" width="54" height="188" rx="25"/><rect x="435" y="295" width="54" height="188" rx="25"/>
  <rect x="711" y="295" width="54" height="188" rx="25"/><rect x="831" y="295" width="54" height="188" rx="25"/>
 </g>
 <g fill="#8bc9ed" stroke="#fff" stroke-width="6"><rect x="385" y="320" width="82" height="92" rx="34"/><rect x="733" y="320" width="82" height="92" rx="34"/></g>
 <path d="M530 513v-115q0-74 70-74t70 74v115z" fill="#485a98" stroke="#fff" stroke-width="7"/>
 <path d="M550 513v-112q0-52 50-52t50 52v112z" fill="#9bcff0"/>
 <rect x="430" y="205" width="340" height="52" rx="13" fill="#34477e" stroke="#fff" stroke-width="4"/>
 <text x="600" y="239" text-anchor="middle" class="sign">SCHOOL OF PACKAGE ARTS</text>
 <path d="M600 146v-48" stroke="#34477e" stroke-width="8"/><path d="M600 100l72 17-72 18z" fill="#ffcf63"/>
</g>
<!-- campus banners -->
<g><path d="M300 270v95l-26-18-26 18v-95" fill="#e77e78" stroke="#fff" stroke-width="3"/><text x="274" y="319" text-anchor="middle" class="tiny" fill="#fff">BUILD</text>
<path d="M900 270v95l-26-18-26 18v-95" fill="#65a8d6" stroke="#fff" stroke-width="3"/><text x="874" y="319" text-anchor="middle" class="tiny" fill="#fff">TEST</text></g>
<!-- chalkboard -->
<g filter="url(#shadow)"><rect x="455" y="290" width="290" height="65" rx="10" fill="#243e48" stroke="#fff" stroke-width="5"/>
<text x="600" y="316" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="13" font-weight="900" fill="#a9f0c8">TODAY'S LESSON</text>
<text x="600" y="340" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="19" font-weight="900" fill="#fff">VERIFY BEFORE GRADUATION</text></g>
