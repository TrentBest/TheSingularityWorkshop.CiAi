<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NuGet University — CiAi alpha package candidates</title>
  <desc id="desc">A cheerful little university campus where NuGet package characters study build, test, verify, and review before graduation. The CiAi package wears an alpha sash and has not yet been published.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f5ff"/><stop offset="1" stop-color="#f8f4ff"/></linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5366c9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#334155" flood-opacity=".16"/></filter>
    <style>
      .ink{fill:#23324d}.muted{fill:#52627c}.small{font:600 17px 'Segoe UI',Arial,sans-serif}.label{font:700 20px 'Segoe UI',Arial,sans-serif}.headline{font:800 38px 'Segoe UI',Arial,sans-serif}.tiny{font:700 13px 'Segoe UI',Arial,sans-serif}
      .window{fill:#9bd7f5;stroke:#fff;stroke-width:7}.eye{fill:#26344d}.cheek{fill:#f7a7a7}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#sky)"/>
  <circle cx="1050" cy="92" r="48" fill="#ffe7a3" opacity=".85"/>
  <g fill="#fff" opacity=".8"><path d="M90 115c-2-20 17-34 35-27 9-23 43-20 49 5 22-1 33 27 16 41H105c-10-3-15-10-15-19z"/><path d="M890 180c-2-17 14-29 29-23 8-20 36-17 41 4 18-1 27 22 13 34h-85c-8-2-12-8-12-15z"/></g>
  <text x="64" y="66" class="small" fill="#5967b5" letter-spacing="3">THE SINGULARITY WORKSHOP PRESENTS</text>
  <text x="64" y="112" class="headline ink">NUGet University</text>
  <text x="66" y="145" class="small muted">A little more studying before these packages graduate.</text>
  <!-- campus building -->
  <g filter="url(#shadow)">
    <rect x="300" y="210" width="600" height="300" rx="20" fill="url(#building)" stroke="#b7c8e6" stroke-width="3"/>
    <path d="M270 224L600 115l330 109z" fill="url(#roof)" stroke="#4354a8" stroke-width="3"/>
    <rect x="552" y="145" width="96" height="70" rx="8" fill="#fff" opacity=".95"/>
    <path d="M570 178h60M600 151v54" stroke="#7c89d8" stroke-width="5" stroke-linecap="round"/>
    <text x="600" y="254" text-anchor="middle" class="label" fill="#394b91">NUGet UNIVERSITY</text>
    <rect x="330" y="280" width="540" height="198" rx="12" fill="#edf6ff"/>
    <g><rect class="window" x="350" y="305" width="95" height="92" rx="10"/><rect class="window" x="475" y="305" width="95" height="92" rx="10"/><rect class="window" x="630" y="305" width="95" height="92" rx="10"/><rect class="window" x="755" y="305" width="95" height="92" rx="10"/></g>
    <rect x="555" y="360" width="90" height="118" rx="42" fill="#b6c6f2" stroke="#fff" stroke-width="7"/>
    <path d="M570 478v-58q0-28 30-28t30 28v58" fill="#7184d1"/>
  </g>
  <!-- chalkboard -->
  <g filter="url(#shadow)">
    <rect x="390" y="286" width="420" height="80" rx="12" fill="#233d4a" stroke="#d6e5f4" stroke-width="7"/>
    <text x="600" y="319" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#b9f4d0">TODAY'S CURRICULUM</text>
    <text x="600" y="347" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="#fff">BUILD  ·  TEST  ·  VERIFY  ·  REVIEW</text>
  </g>
  <!-- package students -->
  <g filter="url(#shadow)">
    <g transform="translate(130 340)">
      <rect x="0" y="0" width="112" height="120" rx="24" fill="#7dd3fc" stroke="#fff" stroke-width="7"/>
      <circle class="eye" cx="37" cy="48" r="6"/><circle class="eye" cx="75" cy="48" r="6"/><path d="M40 70q16 17 32 0" fill="none" stroke="#26344d" stroke-width="5" stroke-linecap="round"/>
      <path d="M22 9l34-30 34 30z" fill="#f5c95e" stroke="#fff" stroke-width="5"/><rect x="50" y="-34" width="12" height="22" rx="3" fill="#f5c95e"/>
      <text x="56" y="103" text-anchor="middle" class="tiny" fill="#16456a">PACKAGE</text>
    </g>
    <g transform="translate(960 355)">
      <rect x="0" y="0" width="105" height="112" rx="23" fill="#c4b5fd" stroke="#fff" stroke-width="7"/>
      <circle class="eye" cx="35" cy="44" r="6"/><circle class="eye" cx="70" cy="44" r="6"/><path d="M37 65q15 15 30 0" fill="none" stroke="#26344d" stroke-width="5" stroke-linecap="round"/>
      <path d="M20 8l32-27 33 27z" fill="#f5c95e" stroke="#fff" stroke-width="5"/>
      <text x="52" y="95" text-anchor="middle" class="tiny" fill="#4c368b">PACKAGE</text>
    </g>
  </g>
  <!-- CiAi student foreground -->
  <g filter="url(#shadow)" transform="translate(495 420)">
    <rect x="0" y="0" width="210" height="145" rx="28" fill="#fff" stroke="#6b83d8" stroke-width="5"/>
    <path d="M50 8l55-45 55 45z" fill="#f3c85b" stroke="#fff" stroke-width="6"/>
    <rect x="98" y="-48" width="14" height="18" rx="3" fill="#f3c85b"/>
    <circle class="eye" cx="72" cy="58" r="7"/><circle class="eye" cx="137" cy="58" r="7"/>
    <path d="M78 82q27 24 53 0" fill="none" stroke="#26344d" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 104h190" stroke="#dbeafe" stroke-width="2"/>
    <text x="105" y="128" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="900" fill="#4354a8">CiAi</text>
    <path d="M-4 18l-26 20 30 14M214 18l26 20-30 14" fill="none" stroke="#6b83d8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- alpha sash and book -->
  <g transform="rotate(-9 765 490)" filter="url(#shadow)">
    <rect x="720" y="420" width="170" height="52" rx="12" fill="#f59e0b" stroke="#fff" stroke-width="5"/>
    <text x="805" y="453" text-anchor="middle" font-family="Segoe UI,Arial" font-size="23" font-weight="900" fill="#422006">ALPHA</text>
  </g>
  <g transform="translate(755 500) rotate(7)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="74" rx="9" fill="#fff" stroke="#8b9bc7" stroke-width="3"/>
    <path d="M75 5v64" stroke="#cbd5e1" stroke-width="3"/>
    <text x="38" y="28" text-anchor="middle" class="tiny" fill="#5967b5">VERSION</text>
    <text x="38" y="50" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="900" fill="#23324d">0.1.0</text>
    <text x="112" y="28" text-anchor="middle" class="tiny" fill="#5967b5">STATUS</text>
    <text x="112" y="50" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="900" fill="#d97706">ALPHA.1</text>
  </g>
  <!-- gate -->
  <g transform="translate(65 510)">
    <path d="M0 55V0h180v55M0 12h180" fill="none" stroke="#7184b5" stroke-width="8" stroke-linecap="round"/>
    <rect x="18" y="15" width="144" height="55" rx="10" fill="#fff" stroke="#7184b5" stroke-width="3"/>
    <text x="90" y="38" text-anchor="middle" class="tiny" fill="#4354a8">CAMPUS GATE</text>
    <text x="90" y="57" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="900" fill="#c2410c">NOT PUBLISHED</text>
  </g>
  <text x="600" y="602" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#596780">Passing the coursework is not the same as graduating.</text>
</svg>