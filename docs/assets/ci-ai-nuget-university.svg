 <path d="M33 10q-25-35-5-53 27 7 32 28 40-27 60 2 30-7 43 25l-8 95q-3 28-32 28H39q-28-4-26-35z" fill="#f5a65b" stroke="#fff" stroke-width="6"/>
 <path d="M44 16l53-24 50 26-52 27z" fill="#ffd08a" stroke="#fff" stroke-width="4"/>
 <path d="M95 19v96" stroke="#d17b43" stroke-width="4"/>
 <ellipse cx="75" cy="66" rx="14" ry="19" class="shine"/><ellipse cx="119" cy="66" rx="14" ry="19" class="shine"/><circle cx="78" cy="69" r="7" class="eye"/><circle cx="116" cy="69" r="7" class="eye"/>
 <path d="M82 94q17 17 34 0" fill="none" stroke="#713f3c" stroke-width="5" stroke-linecap="round"/>
 <path d="M20 86q-34 15-25 39M164 87q32 12 22 35M52 150l-10 26M130 150l15 26" class="limb"/>
 <text x="97" y="135" text-anchor="middle" class="tiny">PKG-101</text>
</g>
<!-- right package monster with little horns -->
<g transform="translate(960 380)" filter="url(#shadow)">
 <path d="M25 25l-13-37 39 22M130 10l37-23-8 44" fill="#a58be5" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
 <rect x="17" y="20" width="145" height="133" rx="27" fill="#8b83d8" stroke="#fff" stroke-width="6"/>
 <path d="M17 51l73-30 72 30-73 32z" fill="#b9b0f4" stroke="#fff" stroke-width="4"/><path d="M89 53v95" stroke="#5d57a8" stroke-width="4"/>
 <ellipse cx="66" cy="91" rx="13" ry="17" class="shine"/><ellipse cx="112" cy="91" rx="13" ry="17" class="shine"/><circle cx="68" cy="94" r="7" class="eye"/><circle cx="110" cy="94" r="7" class="eye"/>
 <path d="M73 117q16 14 32 0" fill="none" stroke="#37305f" stroke-width="5" stroke-linecap="round"/>
 <path d="M17 94q-28 3-31 29M162 95q29 5 30 30M55 151l-8 25M127 151l9 25" class="limb"/>
 <text x="90" y="143" text-anchor="middle" class="tiny">PKG-202</text>
</g>
<!-- featured CiAi package student -->
<g transform="translate(455 440)" filter="url(#shadow)">
 <!-- arms and feet -->
 <path d="M16 85q-35-8-42 20M190 85q37-10 44 17M52 170l-13 28M154 170l14 28" class="limb"/>
 <!-- package body -->
 <rect x="0" y="20" width="210" height="155" rx="28" fill="#f7fbff" stroke="#526bc0" stroke-width="7"/>
 <path d="M0 59l105-43 105 43-105 44z" fill="#b5cbff" stroke="#526bc0" stroke-width="5"/>
 <path d="M105 60v107" stroke="#8298d4" stroke-width="4"/>
 <!-- cute horns and cap -->
 <path d="M47 26L25-7l45 20M163 26l23-33-46 18" fill="#7c65c9" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
 <path d="M58 12l47-38 48 38z" fill="#e8b84f" stroke="#fff" stroke-width="5"/><path d="M104-26v-20" stroke="#e8b84f" stroke-width="6"/><circle cx="104" cy="-48" r="6" fill="#e8b84f"/>
 <ellipse cx="76" cy="93" rx="15" ry="19" class="shine"/><ellipse cx="136" cy="93" rx="15" ry="19" class="shine"/><circle cx="79" cy="96" r="8" class="eye"/><circle cx="133" cy="96" r="8" class="eye"/>
 <path d="M82 123q24 22 48 0" fill="none" stroke="#35446f" stroke-width="6" stroke-linecap="round"/>
 <rect x="25" y="137" width="160" height="29" rx="8" fill="#435db1"/><text x="105" y="158" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="19" font-weight="900" fill="#fff">CiAi</text>
</g>
<!-- alpha sash -->
<g transform="rotate(-8 765 520)" filter="url(#shadow)">
 <path d="M690 480h175v47H690z" fill="#f2a72e" stroke="#fff" stroke-width="5"/>
 <text x="777" y="511" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="24" font-weight="900" fill="#49300e">ALPHA STUDENT</text>
</g>
<!-- diploma / package version book -->
<g transform="translate(745 540) rotate(6)" filter="url(#shadow)">
 <rect width="180" height="62" rx="9" fill="#fff" stroke="#8b9bc7" stroke-width="3"/>
 <text x="90" y="24" text-anchor="middle" class="tiny">CURRENT COURSEWORK</text>
 <text x="90" y="47" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="18" font-weight="900" fill="#4354a8">0.1.0-alpha.1</text>
</g>
<!-- entry gate -->
<g transform="translate(35 535)">
 <path d="M0 90V0h205v90M0 18h205" fill="none" stroke="#566b9e" stroke-width="9"/>
 <rect x="18" y="23" width="169" height="58" rx="9" fill="#fff" stroke="#566b9e" stroke-width="3"/>
 <text x="102" y="46" text-anchor="middle" class="tiny">COMMENCEMENT GATE</text>
 <text x="102" y="67" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="14" font-weight="900" fill="#bd4a38">NOT PUBLISHED</text>
</g>
<text x="600" y="632" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="17" font-weight="800" fill="#344768">Passing the coursework is not the same as graduating.</text>
</svg>