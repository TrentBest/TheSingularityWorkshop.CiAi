<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">NuGet University — CiAi's living package classroom</title>
<desc id="desc">A lively classroom full of package students from the Singularity Workshop ecosystem. CiAi teaches at the front. Animated package students sit at desks while many packages travel through the large windows behind the back row.</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f5f0ff"/><stop offset="1" stop-color="#dce9fa"/></linearGradient>
 <linearGradient id="windowSky" x2="0" y2="1"><stop stop-color="#83cafa"/><stop offset="1" stop-color="#d6f5ed"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#d99a62"/><stop offset="1" stop-color="#985d3e"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#28345c" flood-opacity=".22"/></filter>
 <style>
 .heading{font:900 38px 'Trebuchet MS',Arial;fill:#26365e;letter-spacing:1px}.small{font:700 15px 'Trebuchet MS',Arial;fill:#415477}
 .label{font:900 12px 'Trebuchet MS',Arial;fill:#243454}.chalk{font:900 20px 'Trebuchet MS',Arial;fill:#efffe9}
 .student{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .s2{animation-delay:-.7s}.s3{animation-delay:-1.3s}.s4{animation-delay:-1.8s}
 .blink{animation:blink 4.7s infinite;transform-box:fill-box;transform-origin:center}
 .wave{animation:wave 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:10% 90%}
 .traffic{animation:travel 11s linear infinite}.traffic2{animation:travel 15s linear infinite reverse}.traffic3{animation:travel 9s linear -4s infinite}
 .cloud{animation:cloud 24s ease-in-out infinite alternate}.screen{animation:glow 2.6s ease-in-out infinite alternate}
 .spark{animation:spark 2s ease-in-out infinite}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
 @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
 @keyframes travel{from{transform:translateX(-170px)}to{transform:translateX(950px)}}
 @keyframes cloud{from{transform:translateX(-15px)}to{transform:translateX(35px)}}
 @keyframes glow{from{opacity:.65}to{opacity:1}}
 @keyframes spark{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
 @media(prefers-reduced-motion:reduce){.student,.blink,.wave,.traffic,.traffic2,.traffic3,.cloud,.screen,.spark{animation:none}}
 </style>
 <!-- reusable student body -->
 <g id="studentBody">
  <path d="M8 25L-2 4 22 14M72 14L94 3 84 29" fill="currentColor" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <rect x="5" y="20" width="82" height="76" rx="18" fill="currentColor" stroke="#fff" stroke-width="4"/>
  <path d="M5 39l41-18 41 18-41 19z" fill="#ffffff" opacity=".35"/>
  <g class="blink"><ellipse cx="32" cy="56" rx="8" ry="11" fill="#fff"/><ellipse cx="61" cy="56" rx="8" ry="11" fill="#fff"/><circle cx="34" cy="58" r="4.5" fill="#17243d"/><circle cx="59" cy="58" r="4.5" fill="#17243d"/></g>
  <path d="M34 75q12 11 25 0" fill="none" stroke="#293553" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M6 64l-13 14M86 64l13 14" fill="none" stroke="#46557a" stroke-width="5" stroke-linecap="round"/>
 </g>
</defs>
<rect width="1200" height="820" rx="22" fill="url(#wall)"/>
<text x="42" y="54" class="small" letter-spacing="3">THE SINGULARITY WORKSHOP • LIVING CAMPUS</text>
<text x="42" y="100" class="heading">NUGET UNIVERSITY — CLASS IS IN SESSION</text>
<text x="44" y="128" class="small">Every package has a name, a seat, a lesson, and a journey ahead.</text>
<!-- rear wall and panoramic windows behind the back row -->
<rect x="38" y="151" width="1124" height="245" rx="18" fill="#d3c8e8" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
<rect x="55" y="168" width="1090" height="210" rx="8" fill="url(#windowSky)"/>
<g class="cloud" fill="#fff" opacity=".85"><path d="M110 225q-10-28 22-35 15-38 51-17 31-7 39 27 32 0 27 25z"/></g>
<g class="cloud" fill="#fff" opacity=".75" style="animation-delay:-9s"><path d="M780 210q-7-23 20-30 12-32 43-15 26-6 33 22 26 0 23 23z"/></g>
<path d="M55 330q180-55 340 0t330-4 420 4v48H55z" fill="#79c88d"/>
<!-- campus skyline -->
<g opacity=".85"><path d="M110 330v-80h75v80M205 330v-118h90v118M315 330v-65h82v65M865 330v-100h86v100M970 330v-135h110v135" fill="#8292bd" stroke="#fff" stroke-width="4"/>
<g fill="#d7f5ff"><path d="M124 267h17v22h-17zM155 267h17v22h-17zM221 233h19v23h-19zM260 233h19v23h-19zM881 250h19v23h-19zM916 250h19v23h-19zM990 220h20v24h-20zM1035 220h20v24h-20z"/></g></g>
<!-- moving packages outside: streams pass in both directions -->
<g class="traffic" filter="url(#shadow)" style="color:#e79a52"><use href="#studentBody" transform="translate(70 252) scale(.42)"/><text x="70" y="305" class="label">FSM_API</text></g>
<g class="traffic2" filter="url(#shadow)" style="color:#8c80d9"><use href="#studentBody" transform="translate(260 210) scale(.36)"/><text x="260" y="255" class="label">GrammarAi</text></g>
<g class="traffic3" filter="url(#shadow)" style="color:#62b8a4"><use href="#studentBody" transform="translate(570 285) scale(.38)"/><text x="570" y="333" class="label">Physics</text></g>
<g class="traffic" style="animation-delay:-6s;color:#e57d9d"><use href="#studentBody" transform="translate(740 230) scale(.34)"/><text x="740" y="272" class="label">Renderer</text></g>
<g class="traffic2" style="animation-delay:-3s;color:#5f9bd2"><use href="#studentBody" transform="translate(970 270) scale(.4)"/><text x="970" y="320" class="label">Experiences</text></g>
<g class="traffic3" style="animation-delay:-7s;color:#d6a947"><use href="#studentBody" transform="translate(400 190) scale(.3)"/></g>
<!-- window mullions -->
<path d="M420 168v210M785 168v210M55 274h1090" stroke="#fff" stroke-width="11" opacity=".95"/>
<!-- classroom trim -->
<path d="M0 405h1200" stroke="#9c8ab8" stroke-width="15"/>
<!-- blackboard and teacher -->
<g filter="url(#shadow)"><rect x="50" y="425" width="275" height="175" rx="12" fill="#254b4a" stroke="#fff" stroke-width="7"/><text x="187" y="466" text-anchor="middle" class="chalk">TODAY'S LESSON</text><text x="187" y="504" text-anchor="middle" class="chalk" font-size="16">BUILD • TEST • VERIFY</text><path d="M95 535h185M110 557h145" stroke="#c7efc7" stroke-width="4" stroke-linecap="round" opacity=".8"/><text x="187" y="585" text-anchor="middle" class="chalk" font-size="13">EVIDENCE BEFORE RELEASE</text></g>
<!-- CiAi instructor stands beside the board, clearly distinct from students -->
<g transform="translate(365 425)" filter="url(#shadow)">
 <path d="M25 125q-30 5-37 35M135 125q32 3 39 31M55 205l-8 34M112 205l10 34" fill="none" stroke="#46557a" stroke-width="8" stroke-linecap="round"/>
 <rect x="8" y="48" width="145" height="160" rx="30" fill="#f8fbff" stroke="#536bc0" stroke-width="6"/>
 <path d="M8 82l72-35 73 35-73 34z" fill="#a9c2ff" stroke="#536bc0" stroke-width="4"/>
 <path d="M42 48L26 20l36 15M120 48l18-28-36 15" fill="#8870d2" stroke="#fff" stroke-width="4"/>
 <g class="blink"><ellipse cx="55" cy="120" rx="12" ry="16" fill="#fff"/><ellipse cx="106" cy="120" rx="12" ry="16" fill="#fff"/><circle cx="58" cy="122" r="6" fill="#182641"/><circle cx="103" cy="122" r="6" fill="#182641"/></g>
 <path d="M62 151q19 16 38 0" fill="none" stroke="#35446f" stroke-width="5" stroke-linecap="round"/>
 <rect x="27" y="171" width="108" height="27" rx="7" fill="#465db0"/><text x="81" y="190" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="18" font-weight="900" fill="#fff">CiAi</text>
 <path d="M150 105q40-30 55-72" fill="none" stroke="#46557a" stroke-width="8" stroke-linecap="round"/><circle cx="207" cy="31" r="10" fill="#f8fbff" stroke="#46557a" stroke-width="4" class="wave"/>
 <path d="M205 31l24-18" stroke="#f4d17a" stroke-width="5" stroke-linecap="round"/>
 <rect x="5" y="220" width="154" height="28" rx="8" fill="#e8a63d"/><text x="82" y="240" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="15" font-weight="900" fill="#49300e">INSTRUCTOR</text>
</g>
<!-- rows of package students at desks -->
<!-- back row -->
<g class="student" style="color:#f0a35b" transform="translate(570 425)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">FSM_API</text></g>
<g class="student s2" style="color:#8c80d9" transform="translate(690 425)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">GrammarAi</text></g>
<g class="student s3" style="color:#65b9a1" transform="translate(810 425)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">ProtocolAi</text></g>
<g class="student s4" style="color:#e77e9b" transform="translate(930 425)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">HeadlessAi</text></g>
<g class="student s2" style="color:#669ed1" transform="translate(1050 425)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">CommandAi</text></g>
<!-- middle row -->
<g class="student s3" style="color:#d7a844" transform="translate(485 555)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">FSM_COS</text></g>
<g class="student" style="color:#65a8cb" transform="translate(610 555)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Foundry</text></g>
<g class="student s4" style="color:#b67cc5" transform="translate(735 555)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Ontology</text></g>
<g class="student s2" style="color:#78b66d" transform="translate(860 555)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Physics</text></g>
<g class="student s3" style="color:#e18c59" transform="translate(985 555)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Gestures</text></g>
<!-- desks in front of each row -->
<g filter="url(#shadow)"><path d="M535 535h600l-20 30H555z" fill="url(#desk)" stroke="#774b37" stroke-width="4"/><path d="M565 565v37M1090 565v37" stroke="#774b37" stroke-width="9"/><path d="M450 665h650l-22 32H472z" fill="url(#desk)" stroke="#774b37" stroke-width="4"/><path d="M490 697v35M1060 697v35" stroke="#774b37" stroke-width="9"/></g>
<!-- front row close-up -->
<g class="student s2" style="color:#8d9bd6" transform="translate(475 610) scale(1.08)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Renderer</text></g>
<g class="student s4" style="color:#e27f83" transform="translate(625 610) scale(1.08)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Visualize</text></g>
<g class="student" style="color:#69b8b1" transform="translate(775 610) scale(1.08)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">AnyApp</text></g>
<g class="student s3" style="color:#d5a64d" transform="translate(925 610) scale(1.08)"><use href="#studentBody"/><text x="46" y="112" text-anchor="middle" class="label">Economy</text></g>
<!-- desk tops in front row -->
<path d="M425 728h690l-25 40H450z" fill="url(#desk)" stroke="#774b37" stroke-width="4"/>
<path d="M470 768v25M1060 768v25" stroke="#774b37" stroke-width="9"/>
<g fill="#fff3a8"><path class="spark" d="M330 660l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path class="spark" style="animation-delay:-.9s" d="M1135 470l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
<text x="600" y="808" text-anchor="middle" class="small">The classroom is alive. The packages are the students. CiAi is here to teach them how to ship with evidence.</text>
</svg>