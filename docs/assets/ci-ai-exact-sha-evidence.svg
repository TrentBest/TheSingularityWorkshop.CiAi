<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Exact commit evidence path</title><desc id="desc">A candidate commit SHA is matched to GitHub workflow runs, attempts, jobs and steps. CiAi verifies identity and completeness, then emits a traceable JSON and Markdown observation. It does not authorize release.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#172d3c"/></linearGradient><linearGradient id="glow"><stop stop-color="#43d9c4"/><stop offset="1" stop-color="#6b9cff"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1fb}.muted{fill:#a9bbcf;font-size:15px}.head{font-size:18px;font-weight:700}.sub{font-size:13px;fill:#a9bbcf}.panel{fill:#1d3045;stroke:#45627e;stroke-width:1.5}.line{stroke:#5b9fc1;stroke-width:2.5;fill:none;stroke-dasharray:7 7}.pulse{stroke:#62e6d2;stroke-width:3;stroke-linecap:round;stroke-dasharray:20 260;animation:travel 4s linear infinite}.node{fill:#43d9c4}.warn{fill:#f3bf68}.tag{font-size:12px;letter-spacing:1.2px;fill:#71e0d0;font-weight:700}
@keyframes travel{to{stroke-dashoffset:-280}}@keyframes breathe{50%{opacity:.45;transform:scale(1.08)}}
</style>
<rect width="1100" height="420" rx="22" fill="url(#bg)"/>
<text x="44" y="48" class="tag">READ-ONLY OBSERVATION</text><text x="44" y="80" font-size="27" font-weight="700">Evidence follows one exact source identity</text>
<g transform="translate(42 132)"><rect class="panel" width="180" height="150" rx="14"/><circle cx="25" cy="28" r="7" class="node"/><text x="44" y="34" class="head">Candidate SHA</text><text x="18" y="72" class="sub">Full 40-character</text><text x="18" y="93" class="sub">commit identity</text><rect x="18" y="111" width="144" height="20" rx="5" fill="#122336"/><text x="28" y="125" font-size="10" fill="#8ce9dc">immutable input</text></g>
<path d="M222 207H260" class="line"/><path d="M222 207H260" class="pulse"/>
<g transform="translate(260 132)"><rect class="panel" width="210" height="150" rx="14"/><circle cx="25" cy="28" r="7" class="node"/><text x="44" y="34" class="head">GitHub Actions</text><text x="18" y="72" class="sub">Workflow runs + attempts</text><text x="18" y="94" class="sub">Jobs + steps + timestamps</text><text x="18" y="123" class="sub">Provider evidence URLs</text></g>
<path d="M470 207H508" class="line"/><path d="M470 207H508" class="pulse"/>
<g transform="translate(508 132)"><rect class="panel" width="230" height="150" rx="14"/><circle cx="25" cy="28" r="7" class="node"/><text x="44" y="34" class="head">CiAi verifier</text><text x="18" y="72" class="sub">Reconcile repo + SHA</text><text x="18" y="94" class="sub">Check completeness + terminal</text><text x="18" y="116" class="sub">Reject missing or mismatched</text><text x="18" y="136" class="sub">evidence — fail closed</text></g>
<path d="M738 207H778" class="line"/><path d="M738 207H778" class="pulse"/>
<g transform="translate(778 132)"><rect class="panel" width="280" height="150" rx="14"/><circle cx="25" cy="28" r="7" class="node"/><text x="44" y="34" class="head">Observation report</text><text x="18" y="72" class="sub">ciai.commit-observation.v2</text><text x="18" y="94" class="sub">JSON + Markdown</text><text x="18" y="116" class="sub">Traceable back to source runs</text><text x="18" y="136" class="sub">Facts and policy — not authority</text></g>
<rect x="42" y="326" width="1016" height="54" rx="10" fill="#122638" stroke="#35516b"/><circle cx="67" cy="353" r="7" class="warn"/><text x="88" y="359" font-size="15" font-weight="700">A green observer run means collection succeeded; the observed application may still have failed.</text>
</svg>