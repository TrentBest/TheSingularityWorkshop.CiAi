<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">After CiAi: CI evidence becomes inspectable</title><desc id="desc">A sanitized conceptual diagram showing GitHub Actions executing workflows, CiAi observing exact-commit evidence and producing a versioned JSON and Markdown report, with human release authority retained.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#102e38"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/><circle cx="1040" cy="70" r="115" fill="#2dd4bf" opacity=".10"/><text x="54" y="58" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">AFTER CiAi</text><text x="54" y="91" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="18">Keep the runner. Make the evidence legible.</text>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="52" y="180" width="250" height="190" rx="20" fill="#15243b" stroke="#64748b" stroke-width="1.5"/><text x="177" y="222" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">GitHub Actions</text><text x="177" y="254" text-anchor="middle" fill="#cbd5e1" font-size="16">Build • test • analyze</text><text x="177" y="279" text-anchor="middle" fill="#cbd5e1" font-size="16">Owns execution facts</text><rect x="88" y="309" width="178" height="36" rx="18" fill="#20344e"/><text x="177" y="332" text-anchor="middle" fill="#93c5fd" font-size="14">Exact commit SHA</text>
<path d="M302 275 H390" stroke="url(#teal)" stroke-width="4" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.5s" repeatCount="indefinite"/></path><path d="M379 264 L393 275 L379 286" fill="none" stroke="#5eead4" stroke-width="4"/>
<rect x="402" y="150" width="340" height="250" rx="22" fill="#11383c" stroke="#2dd4bf" stroke-width="2"/><rect x="394" y="142" width="356" height="266" rx="28" fill="#2dd4bf" opacity=".10" filter="url(#glow)"/><text x="572" y="194" text-anchor="middle" fill="#ccfbf1" font-size="26" font-weight="700">CiAi</text><text x="572" y="224" text-anchor="middle" fill="#f8fafc" font-size="17">Observe • normalize • verify</text><path d="M445 250 H699" stroke="#2dd4bf" opacity=".5"/><g fill="#d1fae5" font-size="16"><text x="445" y="281">✓ Repository + exact SHA</text><text x="445" y="310">✓ Workflow / job / step states</text><text x="445" y="339">✓ Evidence links + coverage</text><text x="445" y="368">✓ Missing / unfinished evidence</text></g>
<path d="M742 275 H817" stroke="url(#teal)" stroke-width="4" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.5s" repeatCount="indefinite"/></path><path d="M806 264 L820 275 L806 286" fill="none" stroke="#5eead4" stroke-width="4"/>
<rect x="830" y="180" width="318" height="190" rx="20" fill="#172d40" stroke="#60a5fa" stroke-width="1.5"/><text x="989" y="221" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="700">Reviewable report</text><rect x="866" y="242" width="246" height="43" rx="10" fill="#203c4d"/><text x="989" y="269" text-anchor="middle" fill="#a7f3d0" font-size="16">JSON · versioned contract</text><rect x="866" y="296" width="246" height="43" rx="10" fill="#203c4d"/><text x="989" y="323" text-anchor="middle" fill="#bfdbfe" font-size="16">Markdown · human-readable</text>
<path d="M989 370 V425 H572 V408" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 7"/><rect x="362" y="425" width="420" height="65" rx="16" fill="#17243a" stroke="#64748b"/><text x="572" y="452" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Human keeps release authority</text><text x="572" y="474" text-anchor="middle" fill="#cbd5e1" font-size="14">Advisory observer ≠ publish approval</text><text x="600" y="535" text-anchor="middle" fill="#94a3b8" font-size="15">Pilot view: evidence is clearer; release decisions remain with the owner.</text></g></svg>