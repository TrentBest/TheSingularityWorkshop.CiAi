<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">AgentOnboarding admission and authority boundary</title><desc id="desc">CiAi reads AgentOnboarding.md from an exact pinned commit, validates structure and digest, and returns an eligibility result. The repository document remains untrusted data. Foundry and the host adapter must enforce runtime authorization before dispatch.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#1c3043"/></linearGradient></defs>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1fb}.muted{fill:#a9bbcf;font-size:14px}.head{font-size:18px;font-weight:700}.box{fill:#20374c;stroke:#5b8ba8;stroke-width:1.5}.safe{fill:#153b3b;stroke:#50cbb5;stroke-width:1.5}.danger{fill:#3b2c29;stroke:#d69b65;stroke-width:1.5}.flow{stroke:#62d7c5;stroke-width:2.5;fill:none;stroke-dasharray:6 7;animation:flow 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-120}}
</style>
<rect width="1100" height="420" rx="22" fill="url(#bg)"/><text x="42" y="48" font-size="27" font-weight="700">Admission is evidence, not permission</text><text x="42" y="76" class="muted">The repository describes itself; the host decides what may happen</text>
<g transform="translate(42 126)"><rect class="box" width="215" height="158" rx="14"/><text x="18" y="34" class="head">Pinned repository</text><text x="18" y="72" class="muted">Exact full commit SHA</text><text x="18" y="96" class="muted">Root AgentOnboarding.md</text><text x="18" y="126" class="muted">Untrusted source content</text></g>
<path d="M257 205H294" class="flow"/>
<g transform="translate(294 126)"><rect class="safe" width="235" height="158" rx="14"/><text x="18" y="34" class="head">CiAi validator</text><text x="18" y="72" class="muted">Exact SHA binding</text><text x="18" y="96" class="muted">Structure + size checks</text><text x="18" y="120" class="muted">SHA-256 content digest</text><text x="18" y="143" class="muted">Structured eligibility result</text></g>
<path d="M529 205H566" class="flow"/>
<g transform="translate(566 126)"><rect class="danger" width="220" height="158" rx="14"/><text x="18" y="34" class="head">Foundry</text><text x="18" y="72" class="muted">Task acceptance</text><text x="18" y="96" class="muted">Leases + model turns</text><text x="18" y="120" class="muted">Authorization + handoff</text><text x="18" y="143" class="muted">Runtime enforcement required</text></g>
<path d="M786 205H823" class="flow"/>
<g transform="translate(823 126)"><rect class="danger" width="235" height="158" rx="14"/><text x="18" y="34" class="head">Host adapter</text><text x="18" y="72" class="muted">Authenticated provider reads</text><text x="18" y="96" class="muted">Concrete dispatch</text><text x="18" y="120" class="muted">Owner / host policy gate</text><text x="18" y="143" class="muted">No repo-file permission grants</text></g>
<rect x="42" y="326" width="1016" height="54" rx="10" fill="#122638" stroke="#d69b65"/><text x="66" y="359" font-size="16" font-weight="700">A passing validator is not yet proof that the runtime blocks every unauthorized path.</text>
</svg>