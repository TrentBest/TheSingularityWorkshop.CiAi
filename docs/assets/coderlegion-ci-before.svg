<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Before CiAi: CI evidence spread across workflows</title><desc id="desc">A sanitized conceptual diagram showing a developer navigating separate build, test, package compatibility, source integration, and security workflow pages to assemble a release picture manually.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172a"/><stop offset="1" stop-color="#202b45"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7"/></filter></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/><circle cx="1040" cy="65" r="110" fill="#64748b" opacity=".12"/><text x="54" y="58" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">BEFORE CiAi</text><text x="54" y="91" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="18">The evidence existed. The explanation was manual.</text>
<g font-family="Segoe UI,Arial,sans-serif">
<g fill="#18243a" stroke="#64748b" stroke-width="1.5"><rect x="54" y="143" width="310" height="76" rx="14"/><rect x="54" y="238" width="310" height="76" rx="14"/><rect x="54" y="333" width="310" height="76" rx="14"/><rect x="54" y="428" width="310" height="76" rx="14"/></g>
<g fill="#e2e8f0" font-size="19" font-weight="600"><text x="80" y="176">Build + test workflow</text><text x="80" y="271">Package compatibility</text><text x="80" y="366">Source integration</text><text x="80" y="461">Security analysis</text></g>
<g fill="#94a3b8" font-size="14"><text x="80" y="199">Which commit? Which jobs?</text><text x="80" y="294">Published package or local build?</text><text x="80" y="389">What did this lane actually prove?</text><text x="80" y="484">Same SHA? Latest attempt?</text></g>
<path d="M364 181 C410 181 400 245 450 245 M364 276 C415 276 410 270 450 270 M364 371 C415 371 410 295 450 295 M364 466 C415 466 410 320 450 320" fill="none" stroke="url(#amber)" stroke-width="3" stroke-dasharray="7 8"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="3s" repeatCount="indefinite"/></path>
<rect x="450" y="205" width="300" height="155" rx="18" fill="#2a2630" stroke="#fb923c" stroke-width="2"/><rect x="444" y="199" width="312" height="167" rx="22" fill="#fb923c" opacity=".10" filter="url(#glow)"/><text x="600" y="247" text-anchor="middle" fill="#fed7aa" font-size="21" font-weight="700">Human / AI assistant</text><text x="600" y="279" text-anchor="middle" fill="#f8fafc" font-size="17">Open tabs • compare runs</text><text x="600" y="305" text-anchor="middle" fill="#f8fafc" font-size="17">Infer gaps • re-check SHA</text><text x="600" y="331" text-anchor="middle" fill="#fca5a5" font-size="16">Easy to miss a distinction</text>
<path d="M750 283 H815" stroke="#fb923c" stroke-width="3" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.5s" repeatCount="indefinite"/></path><path d="M805 273 L818 283 L805 293" fill="none" stroke="#fb923c" stroke-width="3"/>
<rect x="828" y="205" width="320" height="155" rx="18" fill="#172b3d" stroke="#64748b" stroke-width="1.5"/><text x="988" y="247" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="700">Release question</text><text x="988" y="279" text-anchor="middle" fill="#cbd5e1" font-size="17">“Is this exact candidate</text><text x="988" y="304" text-anchor="middle" fill="#cbd5e1" font-size="17">actually ready?”</text><text x="988" y="334" text-anchor="middle" fill="#fbbf24" font-size="15">Evidence scattered across views</text>
<text x="600" y="535" text-anchor="middle" fill="#94a3b8" font-size="15">Conceptual illustration only — no private repository names, secrets, tokens, or internal failure details.</text></g></svg>