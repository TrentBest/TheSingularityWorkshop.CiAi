<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">CiAi five Cogs</title><desc id="desc">Five coordination Cogs form a bounded in-process contract path: catalog, request, result, policy, and projection. Capability providers perform domain work. The current proof is in-process, not a remote network round trip.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#1b2d42"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1fb}.muted{fill:#a9bbcf;font-size:14px}.label{font-size:18px;font-weight:700}.num{font-size:12px;fill:#7fe6d7;font-weight:700;letter-spacing:1px}.gear{fill:#203b50;stroke:#59cbbd;stroke-width:2}.path{stroke:#70d9cb;stroke-width:2.5;fill:none;stroke-dasharray:6 8;animation:dash 5s linear infinite}.provider{fill:#1a2b40;stroke:#6a8db0;stroke-width:1.5}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-140}}@keyframes pulse{50%{opacity:.55;transform:scale(1.035)}}
</style>
<rect width="1100" height="460" rx="22" fill="url(#bg)"/><text x="42" y="48" font-size="27" font-weight="700">Five Cogs coordinate; capabilities do the work</text><text x="42" y="76" class="muted">A narrow control plane with explicit contracts and bounded responsibilities</text>
<path d="M155 205H945" class="path"/>
<g class="pulse" transform="translate(48 130)"><circle class="gear" cx="92" cy="76" r="62"/><circle cx="92" cy="76" r="28" fill="#101a2b" stroke="#59cbbd" stroke-width="2"/><text x="92" y="82" text-anchor="middle" class="label">A</text><text x="92" y="164" text-anchor="middle" class="label">Catalog</text><text x="92" y="187" text-anchor="middle" class="muted">Discover contracts</text></g>
<g class="pulse" style="animation-delay:.25s" transform="translate(246 130)"><circle class="gear" cx="92" cy="76" r="62"/><circle cx="92" cy="76" r="28" fill="#101a2b" stroke="#59cbbd" stroke-width="2"/><text x="92" y="82" text-anchor="middle" class="label">B</text><text x="92" y="164" text-anchor="middle" class="label">Request</text><text x="92" y="187" text-anchor="middle" class="muted">Bound the operation</text></g>
<g class="pulse" style="animation-delay:.5s" transform="translate(444 130)"><circle class="gear" cx="92" cy="76" r="62"/><circle cx="92" cy="76" r="28" fill="#101a2b" stroke="#59cbbd" stroke-width="2"/><text x="92" y="82" text-anchor="middle" class="label">C</text><text x="92" y="164" text-anchor="middle" class="label">Result</text><text x="92" y="187" text-anchor="middle" class="muted">Correlate response</text></g>
<g class="pulse" style="animation-delay:.75s" transform="translate(642 130)"><circle class="gear" cx="92" cy="76" r="62"/><circle cx="92" cy="76" r="28" fill="#101a2b" stroke="#59cbbd" stroke-width="2"/><text x="92" y="82" text-anchor="middle" class="label">D</text><text x="92" y="164" text-anchor="middle" class="label">Policy</text><text x="92" y="187" text-anchor="middle" class="muted">Default-deny decision</text></g>
<g class="pulse" style="animation-delay:1s" transform="translate(840 130)"><circle class="gear" cx="92" cy="76" r="62"/><circle cx="92" cy="76" r="28" fill="#101a2b" stroke="#59cbbd" stroke-width="2"/><text x="92" y="82" text-anchor="middle" class="label">E</text><text x="92" y="164" text-anchor="middle" class="label">Projection</text><text x="92" y="187" text-anchor="middle" class="muted">Present lifecycle facts</text></g>
<rect x="48" y="370" width="440" height="58" rx="10" class="provider"/><text x="68" y="395" class="num">DOMAIN EXECUTION</text><text x="68" y="416" class="muted">Capability providers perform the actual work</text>
<rect x="512" y="370" width="540" height="58" rx="10" fill="#392d25" stroke="#d9a85f"/><text x="532" y="395" font-size="12" fill="#f3c77e" font-weight="700">CURRENT PROOF BOUNDARY</text><text x="532" y="416" class="muted">Pinned in-process contract proof — not remote dispatch</text>
</svg>