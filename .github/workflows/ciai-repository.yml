name: CiAi Repository Contract

on:
  workflow_call:
    inputs:
      ciai-ref:
        description: "CiAi source branch or immutable commit containing the repository tool."
        required: false
        type: string
        default: development
      stamp-pr:
        description: "Automatically stamp README badges on same-repository pull-request branches."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stamp-pr:
    if: ${{ inputs.stamp-pr && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      stamped-sha: ${{ steps.stamp.outputs.sha }}
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Check out pinned CiAi stamping tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: ${{ inputs.ciai-ref }}
          path: .ciai-tool
          submodules: recursive
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Stamp every repository-owned README.md
        run: dotnet run --project .ciai-tool/tools/CiAi.Repository -- --stamp-readmes
      - name: Commit only managed README badge changes
        id: stamp
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -n "$(git status --porcelain -- README.md ':(glob)**/README.md')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- README.md ':(glob)**/README.md'
            git commit -m "chore: stamp CiAi README badges"
            git push origin "HEAD:${PR_HEAD_REF}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  repository:
    needs: [stamp-pr]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the consuming repository at the stamped exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.stamp-pr.outputs.stamped-sha || github.sha }}
      - name: Check out pinned CiAi repository tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: ${{ inputs.ciai-ref }}
          path: .ciai-tool
          submodules: recursive
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Verify repository manifest and README badges
        run: dotnet run --project .ciai-tool/tools/CiAi.Repository -- --check-readmes
