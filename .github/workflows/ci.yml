name: CiAi Contract Verification

on:
  push:
    branches: [development, master, integration/ciai-v1-evidence-contracts]
    paths:
      - "src/**"
      - "integration/**"
      - ".gitmodules"
      - ".github/workflows/**"
      - "external/**"
      - "tests/**"
      - "samples/**"
      - "README.md"
      - "CiAi.slnx"
      - "Directory.Build.*"
      - "global.json"
      - "NuGet.config"
      - ".config/**"
  pull_request:
    branches: [development, master]
    paths:
      - "src/**"
      - "integration/**"
      - ".gitmodules"
      - ".github/workflows/**"
      - "external/**"
      - "tests/**"
      - "samples/**"
      - "README.md"
      - "CiAi.slnx"
      - "Directory.Build.*"
      - "global.json"
      - "NuGet.config"
      - ".config/**"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Optional existing branch to gate; blank uses the branch selected for this workflow run."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ciai-contract-${{ github.ref }}-${{ inputs.target_branch || 'default' }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Resolve optional branch target to an immutable commit
        id: resolve-target
        if: github.event_name == 'workflow_dispatch' && inputs.target_branch != ''
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null; then
            echo "::error::Invalid branch name."
            exit 1
          fi
          matches="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          if [ -z "$matches" ] || [ "$(printf '%s\n' "$matches" | wc -l)" -ne 1 ]; then
            echo "::error::Target must resolve to exactly one existing branch."
            exit 1
          fi
          sha="$(printf '%s\n' "$matches" | awk '{print $1}')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved target did not produce a full commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved branch '$TARGET_BRANCH' to $sha"
      - name: Check out selected target commit
        if: github.event_name == 'workflow_dispatch' && inputs.target_branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve-target.outputs.sha }}
          submodules: recursive
      - name: Verify checkout provenance
        id: provenance
        env:
          EXPECTED_SHA: ${{ steps.resolve-target.outputs.sha || github.sha }}
          TARGET_REF: ${{ inputs.target_branch || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out SHA does not match the resolved target."
            exit 1
          fi
          {
            echo "sha=$actual_sha"
            echo "target_ref=$TARGET_REF"
            echo "repository=$REPOSITORY"
          } >> "$GITHUB_OUTPUT"
          echo "Verified repository=$REPOSITORY ref=$TARGET_REF sha=$actual_sha"
      - name: Create exact workflow provenance artifact
        id: workflow-provenance
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch != '' && format('refs/heads/{0}', inputs.target_branch) || github.ref }}
          CHECKOUT_SHA: ${{ steps.provenance.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-provenance
          pull_request="$(jq -c 'if .pull_request then {
            number: .pull_request.number,
            head: { ref: .pull_request.head.ref, sha: .pull_request.head.sha },
            base: { ref: .pull_request.base.ref, sha: .pull_request.base.sha }
          } else null end' "$GITHUB_EVENT_PATH")"
          jq -n \
            --arg repository "$REPOSITORY" \
            --argjson runId "$RUN_ID" \
            --argjson runAttempt "$RUN_ATTEMPT" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg eventName "$EVENT_NAME" \
            --arg eventRef "$EVENT_REF" \
            --arg eventSha "$EVENT_SHA" \
            --arg checkoutRef "$CHECKOUT_REF" \
            --arg checkoutSha "$CHECKOUT_SHA" \
            --argjson pullRequest "$pull_request" \
            '{
              schema: "ciai.workflow-provenance.v1",
              repository: $repository,
              runId: $runId,
              runAttempt: $runAttempt,
              workflow: { ref: $workflowRef, sha: $workflowSha },
              event: {
                name: $eventName,
                ref: $eventRef,
                sha: $eventSha,
                pullRequest: $pullRequest
              },
              checkout: { ref: $checkoutRef, sha: $checkoutSha }
            }' > artifacts/workflow-provenance/workflow-provenance.json
          jq -e '
            .schema == "ciai.workflow-provenance.v1" and
            (.repository | type == "string" and length > 0) and
            (.runId | type == "number" and . > 0) and
            (.runAttempt | type == "number" and . > 0) and
            (.workflow.sha | test("^[0-9a-fA-F]{40}$")) and
            (.event.sha | test("^[0-9a-fA-F]{40}$")) and
            (.checkout.sha | test("^[0-9a-fA-F]{40}$"))
          ' artifacts/workflow-provenance/workflow-provenance.json >/dev/null
          echo "Workflow provenance payload created for run $RUN_ID attempt $RUN_ATTEMPT."
      - name: Publish exact workflow provenance artifact
        id: upload-workflow-provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-workflow-provenance-${{ github.run_attempt }}
          path: artifacts/workflow-provenance/workflow-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify pinned ProtocolAi source revision
        env:
          EXPECTED_PROTOCOL_AI_SHA: 024ca3f2fac486d5aefa6f276c5203d5bdfe3bcf
        run: |
          set -euo pipefail
          actual_sha="$(git -C external/ProtocolAi rev-parse HEAD)"
          gitlink_sha="$(git ls-tree HEAD external/ProtocolAi | awk '{print $3}')"
          test "$actual_sha" = "$EXPECTED_PROTOCOL_AI_SHA"
          test "$gitlink_sha" = "$EXPECTED_PROTOCOL_AI_SHA"
          echo "Verified ProtocolAi source pin: $actual_sha"
      - name: Verify pinned GrammarAi source revision
        env:
          EXPECTED_GRAMMAR_AI_SHA: 2582362ad233faeffe82c2de28d464efffb0cda4
        run: |
          set -euo pipefail
          actual_sha="$(git -C external/GrammarAi rev-parse HEAD)"
          gitlink_sha="$(git ls-tree HEAD external/GrammarAi | awk '{print $3}')"
          test "$actual_sha" = "$EXPECTED_GRAMMAR_AI_SHA"
          test "$gitlink_sha" = "$EXPECTED_GRAMMAR_AI_SHA"
          echo "Verified GrammarAi source pin: $actual_sha"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        id: setup-dotnet
        with:
          dotnet-version: 8.0.x
      - name: Restore
        id: restore
        run: dotnet restore CiAi.slnx
      - name: Build
        id: build
        run: dotnet build CiAi.slnx --configuration Release --no-restore
      - name: Install .NET coverage tool
        run: dotnet tool install --global dotnet-coverage
      - name: Run contract checks with coverage
        id: contract-tests
        continue-on-error: true
        run: |
          set +e
          mkdir -p TestResults
          dotnet-coverage collect "dotnet run --project tests/TheSingularityWorkshop.CiAi.ContractTests --configuration Release --no-build" --output-format cobertura --output TestResults/coverage.cobertura.xml 2>&1 | tee TestResults/contract-run.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Create bounded TRX and source provenance archive
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.contract-tests.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import uuid
          import xml.etree.ElementTree as ET
          import zipfile

          outcome = os.environ.get("CONTRACT_OUTCOME", "skipped")
          if outcome == "success":
              trx_outcome, summary_outcome = "Passed", "Passed"
              counters = dict(total="1", executed="1", passed="1", failed="0", error="0",
                              timeout="0", aborted="0", notExecuted="0", inconclusive="0",
                              notRunnable="0", disconnected="0", warning="0",
                              passedButRunAborted="0", pending="0", inProgress="0")
          elif outcome == "failure":
              trx_outcome, summary_outcome = "Failed", "Failed"
              counters = dict(total="1", executed="1", passed="0", failed="1", error="0",
                              timeout="0", aborted="0", notExecuted="0", inconclusive="0",
                              notRunnable="0", disconnected="0", warning="0",
                              passedButRunAborted="0", pending="0", inProgress="0")
          else:
              trx_outcome, summary_outcome = "NotExecuted", "NotExecuted"
              counters = dict(total="1", executed="0", passed="0", failed="0", error="0",
                              timeout="0", aborted="0", notExecuted="1", inconclusive="0",
                              notRunnable="0", disconnected="0", warning="0",
                              passedButRunAborted="0", pending="0", inProgress="0")

          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          identity = f"{os.environ['RUN_ID']}:{os.environ['RUN_ATTEMPT']}:CiAi.ContractSuite"
          test_id = str(uuid.uuid5(uuid.NAMESPACE_URL, identity))
          execution_id = str(uuid.uuid5(uuid.NAMESPACE_OID, identity))
          root = ET.Element("TestRun", {
              "id": str(uuid.uuid5(uuid.NAMESPACE_DNS, identity)),
              "name": "CiAi Contract Suite",
              "runUser": "GitHub Actions"
          })
          ET.SubElement(root, "Times", {
              "creation": now, "queuing": now, "start": now, "finish": now
          })
          results = ET.SubElement(root, "Results")
          result = ET.SubElement(results, "UnitTestResult", {
              "executionId": execution_id,
              "testId": test_id,
              "testName": "CiAi.ContractSuite",
              "outcome": trx_outcome,
              "duration": "00:00:00.001",
              "startTime": now,
              "endTime": now
          })
          if outcome == "failure":
              log_path = pathlib.Path("TestResults/contract-run.log")
              diagnostic = log_path.read_text(errors="replace")[-8000:] if log_path.exists() else ""
              output = ET.SubElement(result, "Output")
              error = ET.SubElement(output, "ErrorInfo")
              ET.SubElement(error, "Message").text = "The CiAi contract suite command failed. Bounded provider job output follows."
              ET.SubElement(error, "StackTrace").text = diagnostic or "No contract-suite diagnostic output was captured."
          summary = ET.SubElement(root, "ResultSummary", {"outcome": summary_outcome})
          ET.SubElement(summary, "Counters", counters)
          trx_path = pathlib.Path("TestResults/contract-suite.trx")
          trx_path.parent.mkdir(parents=True, exist_ok=True)
          ET.ElementTree(root).write(trx_path, encoding="utf-8", xml_declaration=True)

          provenance_path = pathlib.Path("artifacts/workflow-provenance/workflow-provenance.json")
          if not provenance_path.is_file() or provenance_path.stat().st_size == 0:
              raise SystemExit("Exact workflow provenance payload is missing; source evidence cannot be packaged.")
          archive_path = pathlib.Path("artifacts/ciai-test-results.zip")
          archive_path.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.write(trx_path, "results.trx")
              archive.write(provenance_path, "provenance.json")
          print(f"Created bounded CiAi TRX/provenance archive for run {identity}.")
          PY
      - name: Upload exact contract source artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-test-results-${{ github.run_attempt }}
          path: artifacts/ciai-test-results.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload coverage to Codecov
        id: codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.CiAi
          files: TestResults/coverage.cobertura.xml
          fail_ci_if_error: true
          verbose: true
      - name: Pack NuGet package
        id: pack
        run: dotnet pack src/TheSingularityWorkshop.CiAi/TheSingularityWorkshop.CiAi.csproj --configuration Release --no-build --output artifacts/packages
      - name: Pack dependency and CiAi into an isolated local feed
        id: package-local-feed
        run: |
          set -euo pipefail
          mkdir -p artifacts/local-feed
          dotnet pack external/CommandAi/TheSingularityWorkshop.CommandAi.csproj --configuration Release --no-restore --output artifacts/local-feed
          dotnet pack external/GrammarAi/TheSingularityWorkshop.GrammarAi.csproj --configuration Release --no-restore --output artifacts/local-feed
          dotnet pack external/ProtocolAi/TheSingularityWorkshop.ProtocolAi.csproj --configuration Release --no-restore --output artifacts/local-feed
          dotnet pack src/TheSingularityWorkshop.CiAi/TheSingularityWorkshop.CiAi.csproj --configuration Release --no-build --output artifacts/local-feed
      - name: Restore and build an external package consumer
        id: package-consumer
        run: |
          set -euo pipefail
          dotnet restore tests/PackageConsumerSmoke/PackageConsumerSmoke.csproj --source artifacts/local-feed --source https://api.nuget.org/v3/index.json
          dotnet build tests/PackageConsumerSmoke/PackageConsumerSmoke.csproj --configuration Release --no-restore
      - name: Validate packed artifacts
        id: validate-package
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/packages/TheSingularityWorkshop.CiAi.0.1.0-alpha.1.nupkg"
          symbols="artifacts/packages/TheSingularityWorkshop.CiAi.0.1.0-alpha.1.snupkg"
          test -f "$package"
          test -f "$symbols"
          unzip -Z1 "$package" | grep -Fx "README.md"
          unzip -p "$package" "*.nuspec" | grep -F "<id>TheSingularityWorkshop.CiAi</id>"
          unzip -p "$package" "*.nuspec" | grep -F "<version>0.1.0-alpha.1</version>"
      - name: Upload package artifacts for release inspection
        id: upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-package-candidate
          path: artifacts/packages/*
          if-no-files-found: error
      - name: Summarize target provenance and gate evidence
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_branch || github.ref_name }}
          TARGET_SHA: ${{ steps.provenance.outputs.sha || steps.resolve-target.outputs.sha || github.sha }}
          POLICY_PROFILE: ciai-contract-verification-v1
          JOB_STATUS: ${{ job.status }}
          PROVENANCE_STATUS: ${{ steps.provenance.outcome }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          CONTRACT_STATUS: ${{ steps.contract-tests.outcome }}
          PACK_STATUS: ${{ steps.pack.outcome }}
          PACKAGE_STATUS: ${{ steps.validate-package.outcome }}
          ARTIFACT_STATUS: ${{ steps.upload-artifacts.outcome }}
          CONSUMER_STATUS: ${{ steps.package-consumer.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## CiAi branch-target gate evidence"
            echo
            echo "- Repository: \`$REPOSITORY\`"
            echo "- Requested ref: \`$TARGET_REF\`"
            echo "- Resolved commit: \`$TARGET_SHA\`"
            echo "- Policy profile: \`$POLICY_PROFILE\`"
            echo "- Job status: **$JOB_STATUS**"
            echo
            echo "| Required check | Result |"
            echo "|---|---|"
            echo "| Checkout provenance | $PROVENANCE_STATUS |"
            echo "| Restore | $RESTORE_STATUS |"
            echo "| Release build | $BUILD_STATUS |"
            echo "| Contract tests | $CONTRACT_STATUS |"
            echo "| Package creation | $PACK_STATUS |"
            echo "| Package validation | $PACKAGE_STATUS |"
            echo "| Evidence artifact upload | $ARTIFACT_STATUS |"
            echo "| External package consumer restore/build | $CONSUMER_STATUS |"
            echo
            if [ "$JOB_STATUS" = "success" ] && [ "$PROVENANCE_STATUS" = "success" ] && [ "$RESTORE_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ] && [ "$CONTRACT_STATUS" = "success" ] && [ "$PACK_STATUS" = "success" ] && [ "$PACKAGE_STATUS" = "success" ] && [ "$ARTIFACT_STATUS" = "success" ] && [ "$CONSUMER_STATUS" = "success" ]; then
              echo "**Evidence completeness: complete** — all required gate steps succeeded for the resolved commit."
            else
              echo "**Evidence completeness: incomplete** — at least one required gate step did not succeed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed when contract tests failed
        if: always() && steps.contract-tests.outcome == 'failure'
        run: |
          echo "::error::The CiAi contract test suite failed; source diagnostics were retained, but the required gate remains failed."
          exit 1
