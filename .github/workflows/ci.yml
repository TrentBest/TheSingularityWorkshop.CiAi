name: CiAi Contract Verification

on:
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "README.md"
      - "CiAi.slnx"
      - "Directory.Build.*"
      - "global.json"
      - "NuGet.config"
      - ".config/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/observe-release-candidate.yml"
      - ".github/workflows/serialization-benchmark-dispatch.yml"
  pull_request:
    branches: [development, master]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "README.md"
      - "CiAi.slnx"
      - "Directory.Build.*"
      - "global.json"
      - "NuGet.config"
      - ".config/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/observe-release-candidate.yml"
      - ".github/workflows/serialization-benchmark-dispatch.yml"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Optional feature branch to test; workflow definition must run from trusted development."
        required: false
        type: string
        default: ""
      ciai_request_id:
        description: "Optional CiAi dispatch request identity; enables the correlated exact-SHA dispatch contract."
        required: false
        type: string
        default: ""
      ciai_correlation_id:
        description: "CiAi task correlation identity."
        required: false
        type: string
        default: ""
      ciai_task_id:
        description: "Foundry task identity."
        required: false
        type: string
        default: ""
      ciai_candidate_sha:
        description: "Exact 40-character candidate SHA expected for this dispatch."
        required: false
        type: string
        default: ""
      ciai_attempt_number:
        description: "Bounded task attempt number (1-5)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ciai-contract-${{ github.ref }}-${{ inputs.ciai_request_id || inputs.target_branch || 'default' }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Validate optional CiAi dispatch envelope
        id: ciai-envelope
        if: github.event_name == 'workflow_dispatch'
        env:
          CIAI_REQUEST_ID: ${{ inputs.ciai_request_id }}
          CIAI_CORRELATION_ID: ${{ inputs.ciai_correlation_id }}
          CIAI_TASK_ID: ${{ inputs.ciai_task_id }}
          CIAI_CANDIDATE_SHA: ${{ inputs.ciai_candidate_sha }}
          CIAI_ATTEMPT_NUMBER: ${{ inputs.ciai_attempt_number }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          values=("$CIAI_REQUEST_ID" "$CIAI_CORRELATION_ID" "$CIAI_TASK_ID" "$CIAI_CANDIDATE_SHA" "$CIAI_ATTEMPT_NUMBER")
          supplied=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then supplied=$((supplied + 1)); fi
          done
          if [ "$EVENT_REF" != "refs/heads/development" ]; then
            echo "::error::workflow_dispatch must use the trusted development workflow definition, never a candidate branch definition."
            exit 1
          fi
          if [ "$supplied" -eq 0 ]; then
            exit 0
          fi
          if [ "$supplied" -ne "${#values[@]}" ]; then
            echo "::error::CiAi dispatch inputs must be supplied together."
            exit 1
          fi
          for value in "$CIAI_REQUEST_ID" "$CIAI_CORRELATION_ID" "$CIAI_TASK_ID"; do
            if ! [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$ ]]; then
              echo "::error::CiAi identity input contains unsupported characters or exceeds its bound."
              exit 1
            fi
          done
          if ! [[ "$CIAI_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::CiAi candidate SHA must be a full 40-character hexadecimal commit ID."
            exit 1
          fi
          if ! [[ "$CIAI_ATTEMPT_NUMBER" =~ ^[1-5]$ ]]; then
            echo "::error::CiAi attempt number must be between one and five."
            exit 1
          fi
          if ! [[ "$TARGET_BRANCH" == feature/* ]] || ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null; then
            echo "::error::CiAi dispatch must target a valid isolated feature branch."
            exit 1
          fi
          if ! [[ "$EVENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Trusted workflow definition SHA is not a full commit identifier."
            exit 1
          fi
      - name: Resolve optional branch target to an immutable commit
        id: resolve-target
        if: github.event_name == 'workflow_dispatch' && inputs.target_branch != ''
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CIAI_CANDIDATE_SHA: ${{ inputs.ciai_candidate_sha }}
          CIAI_REQUEST_ID: ${{ inputs.ciai_request_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null; then
            echo "::error::Invalid branch name."
            exit 1
          fi
          matches="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          if [ -z "$matches" ] || [ "$(printf '%s\n' "$matches" | wc -l)" -ne 1 ]; then
            echo "::error::Target must resolve to exactly one existing branch."
            exit 1
          fi
          sha="$(printf '%s\n' "$matches" | awk '{print $1}')"
          if [ -n "$CIAI_REQUEST_ID" ] && [ "$sha" != "$CIAI_CANDIDATE_SHA" ]; then
            echo "::error::Feature branch moved after dispatch; refusing to test a different candidate SHA."
            exit 1
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved target did not produce a full commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved branch '$TARGET_BRANCH' to $sha"
      - name: Check out selected target commit
        if: github.event_name == 'workflow_dispatch' && inputs.target_branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve-target.outputs.sha }}
      - name: Verify checkout provenance
        id: provenance
        env:
          EXPECTED_SHA: ${{ steps.resolve-target.outputs.sha || github.sha }}
          TARGET_REF: ${{ inputs.target_branch != '' && format('refs/heads/{0}', inputs.target_branch) || github.ref }}
          WORKFLOW_DEFINITION_REF: ${{ github.workflow_ref }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out SHA does not match the resolved target."
            exit 1
          fi
          provenance_file="$RUNNER_TEMP/ciai-workflow-provenance.json"
          jq -n \
            --arg schema "ciai.workflow-provenance.v1" \
            --arg repository "$REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowRef "$WORKFLOW_DEFINITION_REF" \
            --arg workflowSha "$WORKFLOW_DEFINITION_SHA" \
            --arg eventName "$EVENT_NAME" \
            --arg eventRef "$EVENT_REF" \
            --arg eventSha "$EVENT_SHA" \
            --arg checkoutRef "$TARGET_REF" \
            --arg checkoutSha "$actual_sha" \
            --arg prNumber "$PR_NUMBER" \
            --arg prHeadRef "$PR_HEAD_REF" \
            --arg prHeadSha "$PR_HEAD_SHA" \
            --arg prBaseRef "$PR_BASE_REF" \
            --arg prBaseSha "$PR_BASE_SHA" \
            '{schema:$schema,repository:$repository,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),workflow:{ref:$workflowRef,sha:$workflowSha},event:{name:$eventName,ref:$eventRef,sha:$eventSha,pullRequest:(if $prNumber == "" then null else {number:($prNumber|tonumber),head:{ref:$prHeadRef,sha:$prHeadSha},base:{ref:$prBaseRef,sha:$prBaseSha}} end)},checkout:{ref:$checkoutRef,sha:$checkoutSha}}' \
            > "$provenance_file"
          {
            echo "sha=$actual_sha"
            echo "target_ref=$TARGET_REF"
            echo "workflow_definition_ref=$WORKFLOW_DEFINITION_REF"
            echo "workflow_definition_sha=$WORKFLOW_DEFINITION_SHA"
            echo "event_name=$EVENT_NAME"
            echo "event_ref=$EVENT_REF"
            echo "event_sha=$EVENT_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "pr_head_ref=$PR_HEAD_REF"
            echo "pr_head_sha=$PR_HEAD_SHA"
            echo "pr_base_ref=$PR_BASE_REF"
            echo "pr_base_sha=$PR_BASE_SHA"
            echo "repository=$REPOSITORY"
          } >> "$GITHUB_OUTPUT"
          echo "Verified repository=$REPOSITORY workflow_ref=$WORKFLOW_DEFINITION_REF workflow_sha=$WORKFLOW_DEFINITION_SHA event=$EVENT_NAME event_ref=$EVENT_REF event_sha=$EVENT_SHA checkout_ref=$TARGET_REF checkout_sha=$actual_sha"
      - name: Upload verified checkout provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-workflow-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ciai-workflow-provenance.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        id: setup-dotnet
        with:
          dotnet-version: 8.0.x
      - name: Restore
        id: restore
        run: dotnet restore CiAi.slnx
      - name: Build
        id: build
        run: dotnet build CiAi.slnx --configuration Release --no-restore
      - name: Run contract checks
        id: contract-tests
        run: dotnet run --project tests/TheSingularityWorkshop.CiAi.ContractTests --configuration Release --no-build
      - name: Pack NuGet package
        id: pack
        run: dotnet pack src/TheSingularityWorkshop.CiAi/TheSingularityWorkshop.CiAi.csproj --configuration Release --no-build --output artifacts/packages
      - name: Validate packed artifacts
        id: validate-package
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/packages/TheSingularityWorkshop.CiAi.0.1.0-alpha.1.nupkg"
          symbols="artifacts/packages/TheSingularityWorkshop.CiAi.0.1.0-alpha.1.snupkg"
          test -f "$package"
          test -f "$symbols"
          unzip -Z1 "$package" | grep -Fx "README.md"
          unzip -p "$package" "*.nuspec" | grep -F "<id>TheSingularityWorkshop.CiAi</id>"
          unzip -p "$package" "*.nuspec" | grep -F "<version>0.1.0-alpha.1</version>"
      - name: Upload package artifacts for release inspection
        id: upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-package-candidate
          path: artifacts/packages/*
          if-no-files-found: error
      - name: Summarize target provenance and gate evidence
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ steps.provenance.outputs.target_ref || github.ref }}
          TARGET_SHA: ${{ steps.provenance.outputs.sha || steps.resolve-target.outputs.sha || github.sha }}
          WORKFLOW_DEFINITION_REF: ${{ steps.provenance.outputs.workflow_definition_ref || github.workflow_ref }}
          WORKFLOW_DEFINITION_SHA: ${{ steps.provenance.outputs.workflow_definition_sha || github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CIAI_REQUEST_ID: ${{ inputs.ciai_request_id }}
          CIAI_CORRELATION_ID: ${{ inputs.ciai_correlation_id }}
          CIAI_TASK_ID: ${{ inputs.ciai_task_id }}
          CIAI_ATTEMPT_NUMBER: ${{ inputs.ciai_attempt_number }}
          CIAI_CANDIDATE_SHA: ${{ inputs.ciai_candidate_sha }}
          POLICY_PROFILE: ciai-contract-verification-v1
          JOB_STATUS: ${{ job.status }}
          PROVENANCE_STATUS: ${{ steps.provenance.outcome }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          CONTRACT_STATUS: ${{ steps.contract-tests.outcome }}
          PACK_STATUS: ${{ steps.pack.outcome }}
          PACKAGE_STATUS: ${{ steps.validate-package.outcome }}
          ARTIFACT_STATUS: ${{ steps.upload-artifacts.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## CiAi branch-target gate evidence"
            echo
            echo "- Repository: \`$REPOSITORY\`"
            echo "- Workflow definition ref: \`$WORKFLOW_DEFINITION_REF\`"
            echo "- Workflow definition SHA: \`$WORKFLOW_DEFINITION_SHA\`"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Event ref: \`$EVENT_REF\`"
            echo "- Event SHA: \`$EVENT_SHA\`"
            echo "- Tested checkout ref: \`$TARGET_REF\`"
            echo "- Candidate SHA: \`$TARGET_SHA\`"
            if [ -n "$CIAI_REQUEST_ID" ]; then
              echo "- CiAi request: \`$CIAI_REQUEST_ID\`"
              echo "- Correlation: \`$CIAI_CORRELATION_ID\`"
              echo "- Task: \`$CIAI_TASK_ID\`"
              echo "- Attempt: \`$CIAI_ATTEMPT_NUMBER\`"
              echo "- Candidate SHA: \`$CIAI_CANDIDATE_SHA\`"
            fi
            echo "- Policy profile: \`$POLICY_PROFILE\`"
            echo "- Job status: **$JOB_STATUS**"
            echo
            echo "| Required check | Result |"
            echo "|---|---|"
            echo "| Checkout provenance | $PROVENANCE_STATUS |"
            echo "| Restore | $RESTORE_STATUS |"
            echo "| Release build | $BUILD_STATUS |"
            echo "| Contract tests | $CONTRACT_STATUS |"
            echo "| Package creation | $PACK_STATUS |"
            echo "| Package validation | $PACKAGE_STATUS |"
            echo "| Evidence artifact upload | $ARTIFACT_STATUS |"
            echo
            if [ "$JOB_STATUS" = "success" ] && [ "$PROVENANCE_STATUS" = "success" ] && [ "$RESTORE_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ] && [ "$CONTRACT_STATUS" = "success" ] && [ "$PACK_STATUS" = "success" ] && [ "$PACKAGE_STATUS" = "success" ] && [ "$ARTIFACT_STATUS" = "success" ]; then
              echo "**Evidence completeness: complete** — all required gate steps succeeded for the resolved commit."
            else
              echo "**Evidence completeness: incomplete** — at least one required gate step did not succeed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
